org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 跳过中文路径检查
android.overridePathCheck=true
# 关闭 Kotlin 增量编译（pub 缓存 C 盘 vs 项目 D 盘跨盘符会崩）
kotlin.incremental=false
# 关闭 release 构建的 R8 代码压缩 / 资源压缩。
# Flutter 3.47 默认把 release 的 minifyEnabled 打开，而 shared_preferences(5.x) 等插件
# 是用 JNI 按方法名反射调用 Java 方法的，插件自身没带 keep 规则，R8 会把
# SharedPreferencesApiRegistrar.getAll 这类方法删掉，release 包一启动就抛
# NoSuchMethodError 卡在启动页。这里关掉压缩即可，代价只是 APK 略大。
shrink=false
